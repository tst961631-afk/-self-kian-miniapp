<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SELF KiAN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Vazirmatn:wght@400;600;700&display=swap');

    :root {
      --bg: #0a0a0c;
      --blood: #8b0000;
      --blood-bright: #c41e1e;
      --ash: #1a1a1f;
      --bone: #e8e0d4;
      --muted: #8a8490;
      --gold: #c9a227;
      --card: #121218;
      --border: rgba(196, 30, 30, 0.25);
      --glow: rgba(139, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--bone);
      font-family: "Vazirmatn", system-ui, sans-serif;
      overflow-x: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(ellipse at center, #1a0505 0%, #0a0a0c 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .brand-mark {
      width: 90px;
      height: 90px;
      border: 2px solid var(--blood-bright);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Cinzel", serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--blood-bright);
      text-shadow: 0 0 20px var(--glow);
      box-shadow: 0 0 40px var(--glow), inset 0 0 20px rgba(139,0,0,0.3);
      animation: pulse 1.6s ease-in-out infinite;
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(196,30,30,0.3);
      border-radius: 50%;
      animation: spin 4s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 55px var(--glow); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-title {
      margin-top: 28px;
      font-family: "Cinzel", serif;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      color: var(--bone);
    }
    .load-sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .load-bar {
      width: 180px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      margin-top: 22px;
      overflow: hidden;
    }
    .load-bar span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blood), var(--gold));
      animation: loadfill 2.2s ease forwards;
    }
    @keyframes loadfill { to { width: 100%; } }
    .load-credit {
      position: absolute;
      bottom: 40px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.7;
      padding: 0 24px;
    }
    .load-credit strong {
      color: var(--gold);
      font-weight: 600;
    }

    #app { opacity: 0; transition: opacity 0.6s ease 0.1s; }
    #app.show { opacity: 1; }

    .hero {
      text-align: center;
      padding: 28px 16px 12px;
      background:
        radial-gradient(ellipse at top, rgba(139,0,0,0.25) 0%, transparent 55%),
        linear-gradient(180deg, #120808 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "⚔";
      position: absolute;
      font-size: 8rem;
      opacity: 0.04;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero h1 {
      font-family: "Cinzel", serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--bone);
      text-shadow: 0 0 24px var(--glow);
    }
    .hero .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--gold);
      letter-spacing: 0.08em;
    }
    .hero p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.65;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-wrap { padding: 14px 14px 6px; }
    .search-wrap input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--ash);
      color: var(--bone);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: var(--blood-bright);
      box-shadow: 0 0 0 3px rgba(196,30,30,0.15);
    }
    .search-wrap input::placeholder { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 14px 24px;
    }
    .card {
      background: linear-gradient(160deg, #16161c 0%, #0e0e12 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blood-bright), transparent);
      opacity: 0.6;
    }
    .card:active {
      transform: scale(0.96);
      border-color: var(--blood-bright);
      box-shadow: 0 0 20px var(--glow);
    }
    .card .icon { font-size: 1.55rem; margin-bottom: 8px; filter: drop-shadow(0 0 6px var(--glow)); }
    .card .title { font-size: 0.88rem; font-weight: 600; color: var(--bone); }

    .detail { display: none; padding: 12px 14px 28px; }
    .detail.active { display: block; }
    .detail-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .back {
      background: var(--ash);
      border: 1px solid var(--border);
      color: var(--bone);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
    }
    .detail h2 { font-size: 1.05rem; flex: 1; font-weight: 700; }
    .cmd {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .cmd code {
      display: inline-block;
      background: rgba(196, 30, 30, 0.18);
      color: #ff6b6b;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.86rem;
      direction: ltr;
      unicode-bidi: embed;
      margin: 2px 0;
      border: 1px solid rgba(196,30,30,0.25);
    }
    .cmd .desc {
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 7px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      padding: 8px 16px 28px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.7;
    }
    .footer span { color: var(--gold); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="brand-mark">K</div>
    <div class="load-title">SELF KiAN</div>
    <div class="load-sub">Loading the struggle...</div>
    <div class="load-bar"><span></span></div>
    <div class="load-credit">
      <strong>KiAN</strong> — برنامه‌نویسی از سال <strong>۲۰۱۹</strong><br>
      تا امروز در حال ساخت ابزارهای خفن
    </div>
  </div>

  <div id="app">
    <div class="hero">
      <h1>SELF KiAN</h1>
      <div class="tag">BERSERK MODE</div>
      <p>راهنمای کامل سلف‌بات · ساخته‌شده با خون و کد<br>از ۲۰۱۹ تا الان</p>
    </div>

    <div class="search-wrap" id="searchBox">
      <input type="search" id="q" placeholder="جستجو در دستورات..." autocomplete="off" />
    </div>

    <div class="grid" id="grid"></div>

    <div class="detail" id="detail">
      <div class="detail-head">
        <button class="back" id="backBtn">← بازگشت</button>
        <h2 id="detailTitle"></h2>
      </div>
      <div id="detailBody"></div>
    </div>

    <div class="footer">
      <span>KiAN</span> · Coding since 2019<br>
      ⚡ SELF KiAN Mini App
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#0a0a0c"); } catch(e) {}
      try { tg.setBackgroundColor("#0a0a0c"); } catch(e) {}
    }

    setTimeout(() => {
      document.getElementById("loader").classList.add("hide");
      document.getElementById("app").classList.add("show");
    }, 2400);

    const SECTIONS = [
      { id:"panel", icon:"📊", title:"پنل", items:[
        {c:"/panel",d:"وضعیت اکانت + پینگ + آیدی + الماس"},
        {c:"/ping",d:"تأخیر میلی‌ثانیه"},
        {c:"/id",d:"آیدی عددی"},
        {c:"/info",d:"اطلاعات پروفایل"},
        {c:"/stats",d:"آمار سلف"},
      ]},
      { id:"diamond", icon:"💎", title:"الماس", items:[
        {c:"مصرف",d:"هر ساعت روشن = ۲ الماس"},
        {c:"/واریز 5000",d:"واریز (ادمین)"},
        {c:"/panel",d:"موجودی و روز باقی‌مانده"},
      ]},
      { id:"time", icon:"⏰", title:"ساعت و بیو", items:[
        {c:"/timelast on|off",d:"ساعت فامیلی (جدا)"},
        {c:"/timefirst on|off",d:"ساعت اسم (جدا)"},
        {c:"/biodate on|off",d:"تاریخ شمسی بیو"},
        {c:"/Timeon /Timeoff",d:"روشن/خاموش کلی"},
        {c:"/Timelist",d:"فونت‌ها + وضعیت"},
        {c:"/transfer 8",d:"فونت ثابت"},
        {c:"/transfer random",d:"فونت تصادفی"},
      ]},
      { id:"text", icon:"✍️", title:"فونت پیام", items:[
        {c:"/Textmodon",d:"روشن"},
        {c:"/Textmodoff",d:"خاموش"},
        {c:"/Textlist",d:"لیست با نمونه"},
        {c:"/Texttransfer 5",d:"انتخاب فونت"},
      ]},
      { id:"vo", icon:"👁", title:"یک‌بارمشاهده", items:[
        {c:"/vo on",d:"ذخیره خودکار روشن"},
        {c:"/vo off",d:"خاموش"},
        {c:"/vo",d:"وضعیت + آخرین خطا"},
      ]},
      { id:"tools", icon:"🛠", title:"ابزارها", items:[
        {c:"/weather تهران",d:"آب‌وهوا"},
        {c:"/calc 25*4",d:"ماشین‌حساب"},
        {c:"/wiki متن",d:"ویکی‌پدیا"},
        {c:"/online on|off",d:"همیشه آنلاین"},
        {c:"/screen",d:"استیکر پیام"},
        {c:"/uptime",d:"آپتایم سلف"},
        {c:"/silentword add کلمه",d:"فیلتر کلمه پیوی"},
        {c:"/tr fa Hello",d:"ترجمه"},
      ]},
      { id:"ai", icon:"🤖", title:"هوش مصنوعی", items:[
        {c:"/aibot",d:"تنظیم ربات AI"},
        {c:"/ai سوال",d:"سوال از AI"},
        {c:"/fact",d:"فکت"},
        {c:"/8ball سوال",d:"گوی جادویی"},
      ]},
      { id:"tts", icon:"🎤", title:"ویس", items:[
        {c:"/tts متن",d:"متن به ویس فارسی"},
      ]},
      { id:"enemy", icon:"👿", title:"دشمن", items:[
        {c:"/setenemy",d:"ثبت دشمن"},
        {c:"/delenemy",d:"حذف"},
        {c:"/fosh متن",d:"افزودن فحش"},
        {c:"/enemylist",d:"لیست"},
      ]},
      { id:"silent", icon:"🔇", title:"سکوت", items:[
        {c:"/silent",d:"سکوت کاربر"},
        {c:"/delsilent",d:"لغو"},
        {c:"/silentlist",d:"لیست"},
      ]},
      { id:"live", icon:"📡", title:"زنده", items:[
        {c:"/Live typing|voice|file|photo|off",d:"حالت زنده"},
      ]},
      { id:"react", icon:"❤️", title:"ری‌اکشن", items:[
        {c:"/react ❤️",d:"ری‌اکشن برای فرد"},
        {c:"/react off",d:"حذف"},
      ]},
      { id:"auto", icon:"👁", title:"اتو", items:[
        {c:"/seen on|off",d:"خواندن خودکار"},
        {c:"/reply متن|off",d:"پاسخ خودکار"},
      ]},
      { id:"profile", icon:"👤", title:"پروفایل", items:[
        {c:"/name /bio /username",d:"تنظیم پروفایل"},
        {c:"/sign /photo /delphoto",d:"امضا و عکس"},
      ]},
      { id:"save", icon:"💾", title:"ذخیره", items:[
        {c:"/save",d:"فوروارد Saved"},
        {c:"/savemedia on|off",d:"ذخیره خودکار مدیا"},
      ]},
      { id:"autodel", icon:"⏱", title:"حذف خودکار", items:[
        {c:"/autodel 30",d:"حذف بعد از ثانیه"},
        {c:"/autodel off",d:"خاموش"},
      ]},
      { id:"anim", icon:"✨", title:"انیمیشن", items:[
        {c:"/love /money /star /bear",d:"انیمیشن‌ها"},
        {c:"/fire /party /matrix",d:"بیشتر"},
      ]},
      { id:"spam", icon:"📨", title:"اسپم", items:[
        {c:"/spam 20 متن",d:"اسپم"},
        {c:"/spamstop",d:"توقف"},
      ]},
      { id:"notes", icon:"📝", title:"یادداشت", items:[
        {c:"/note متن",d:"ذخیره"},
        {c:"/notes",d:"لیست"},
        {c:"/delnote 1",d:"حذف"},
      ]},
    ];

    const grid = document.getElementById("grid");
    const detail = document.getElementById("detail");
    const detailTitle = document.getElementById("detailTitle");
    const detailBody = document.getElementById("detailBody");
    const searchBox = document.getElementById("searchBox");
    const q = document.getElementById("q");

    function renderGrid(filter = "") {
      grid.innerHTML = "";
      const f = filter.trim().toLowerCase();
      SECTIONS.forEach(s => {
        const hit = !f || s.title.includes(f) || s.items.some(i =>
          i.c.toLowerCase().includes(f) || i.d.includes(f)
        );
        if (!hit) return;
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `<div class="icon">${s.icon}</div><div class="title">${s.title}</div>`;
        el.onclick = () => openDetail(s);
        grid.appendChild(el);
      });
    }

    function openDetail(s) {
      grid.classList.add("hidden");
      searchBox.classList.add("hidden");
      detail.classList.add("active");
      detailTitle.textContent = s.icon + " " + s.title;
      detailBody.innerHTML = s.items.map(i =>
        `<div class="cmd"><code>${i.c}</code><div class="desc">${i.d}</div></div>`
      ).join("");
      if (tg) try { tg.BackButton.show(); } catch(e) {}
    }

    function goHome() {
      detail.classList.remove("active");
      grid.classList.remove("hidden");
      searchBox.classList.remove("hidden");
      if (tg) try { tg.BackButton.hide(); } catch(e) {}
    }

    document.getElementById("backBtn").onclick = goHome;
    if (tg) { try { tg.BackButton.onClick(goHome); } catch(e) {} }
    q.addEventListener("input", () => renderGrid(q.value));
    renderGrid();
  </script>
</body>
</html>
