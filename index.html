<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Discipline — بدنسازی خانگی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
    :root {
      --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --text:#eef1f6; --muted:#8b93a7;
      --ok:#3ecf8e; --accent:#6c8cff; --warn:#ffb020;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:28px}
    header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
    header h1{font-size:1.12rem;font-weight:800}
    header h1 span{color:var(--ok);font-size:.9rem}
    .subh{color:var(--muted);font-size:.8rem;margin-top:4px}
    .today-banner{
      margin:12px 16px 0;background:linear-gradient(135deg,#1a2332,#171a21);
      border:1px solid var(--line);border-radius:14px;padding:12px 14px;
      display:flex;justify-content:space-between;align-items:center;gap:10px;
    }
    .today-banner b{font-size:1rem}
    .today-banner span{color:var(--muted);font-size:.78rem}
    .ring-row{display:grid;grid-template-columns:1fr 96px;gap:12px;padding:14px 16px 0}
    .stat-card,.ring-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    .stat-card .lbl{color:var(--muted);font-size:.75rem}
    .stat-card .val{font-size:1.35rem;font-weight:800;margin-top:4px}
    .ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:0 auto}
    .ring i{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.75rem;font-weight:800}
    .profile{margin:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    .profile .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .profile label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px}
    .profile input{width:100%;background:#12151c;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-family:inherit}
    .profile .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .btn{border:0;border-radius:12px;padding:11px 14px;font-family:inherit;font-weight:700;font-size:.84rem;cursor:pointer}
    .btn.ok{background:var(--ok);color:#062016}
    .btn.ghost{background:#222733;color:var(--text);border:1px solid var(--line)}
    .bmi{margin-top:10px;font-size:.82rem;color:var(--muted);line-height:1.7}
    .bmi b{color:var(--text)}
    .tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
    .tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font-family:inherit;font-size:.8rem;font-weight:700}
    .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
    .list{padding:0 12px 20px}
    .habit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
    .habit .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
    .habit .name{font-weight:800;font-size:.92rem}
    .habit .meta{color:var(--muted);font-size:.75rem;margin-top:3px;line-height:1.5}
    .tag{font-size:.68rem;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(108,140,255,.15);color:var(--accent);white-space:nowrap}
    .sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .set{
      width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
      background:#12151c;display:grid;place-items:center;font-size:.78rem;font-weight:800;
      color:var(--muted);cursor:pointer;user-select:none;transition:.12s;
    }
    .set.done{background:var(--ok);border-color:var(--ok);color:#062016}
    .set-label{font-size:.72rem;color:var(--muted);margin-top:8px}
    .detail-btn{border:0;background:#222733;color:var(--text);border-radius:8px;padding:6px 10px;font-size:.72rem;font-family:inherit;margin-top:10px}
    .hint{padding:0 16px 8px;color:var(--muted);font-size:.78rem;line-height:1.6}
    .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
    .modal.on{display:flex}
    .sheet{width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px 28px;border:1px solid var(--line)}
    .sheet h3{margin-bottom:10px}
    .sheet p{color:var(--muted);font-size:.88rem;line-height:1.85;white-space:pre-line}
    .sheet .close{margin-top:14px;width:100%;background:#222733;color:var(--text);border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:700}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222733;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:.82rem;opacity:0;transition:.25s;z-index:60}
    .toast.on{opacity:1}
    .lock{font-size:.72rem;color:var(--warn);margin-top:6px}
  </style>
</head>
<body>
  <header>
    <h1>Discipline <span>↗</span> بدنسازی خانگی</h1>
    <div class="subh">هر تیک = یک ست · فقط امروز · دیروز قفل</div>
  </header>

  <div class="today-banner">
    <div>
      <b id="todayTitle">امروز</b>
      <div><span id="todayDate">—</span></div>
    </div>
    <div style="text-align:left;font-size:.78rem;color:var(--muted)">ویرایش روز دیگر ممکن نیست</div>
  </div>

  <div class="profile" id="profileBox">
    <div class="grid">
      <div><label>سن (سال)</label><input id="age" type="number" min="12" max="80" placeholder="25" /></div>
      <div><label>قد (سانتی‌متر)</label><input id="height" type="number" min="120" max="220" placeholder="175" /></div>
      <div><label>وزن (کیلو)</label><input id="weight" type="number" min="35" max="200" placeholder="70" /></div>
    </div>
    <div class="row">
      <button class="btn ok" type="button" id="btnGen">ساخت / به‌روز برنامه</button>
      <button class="btn ghost" type="button" id="btnResetToday">پاک کردن ست‌های امروز</button>
    </div>
    <div class="bmi" id="bmiInfo">سن، قد و وزن را وارد کن تا برنامه بسازد.</div>
  </div>

  <div class="ring-row">
    <div class="stat-card">
      <div class="lbl">ست‌های امروز</div>
      <div class="val" id="todaySets">0 / 0</div>
      <div class="lbl" id="monthCount" style="margin-top:6px">تاریخچه ماه ذخیره می‌شود</div>
    </div>
    <div class="ring-card">
      <div class="ring" id="todayRing" style="--p:0"><i id="todayPct">0%</i></div>
      <div class="lbl" style="margin-top:6px;font-size:.72rem;text-align:center">امروز</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" data-cat="all" class="on">همه</button>
    <button type="button" data-cat="full">کل بدن</button>
    <button type="button" data-cat="chest">سینه</button>
    <button type="button" data-cat="back">پشت</button>
    <button type="button" data-cat="leg">پا</button>
    <button type="button" data-cat="shoulder">شانه</button>
    <button type="button" data-cat="core">میان‌تنه</button>
  </div>
  <p class="hint" id="levelHint"></p>
  <div class="list" id="list"></div>

  <div class="modal" id="modal">
    <div class="sheet">
      <h3 id="mTitle">جزئیات</h3>
      <p id="mBody"></p>
      <button class="close" type="button" id="mClose">بستن</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0f1115"); tg.setBackgroundColor("#0f1115"); } catch(e){} }

const STORE = "home_gym_sets_v3";

const LIB = {
  chest: [
    { id:"c1", name:"شنا سوئدی (پوش‌آپ)",
      how:"دست‌ها کمی بازتر از شانه، بدن صاف. سینه نزدیک زمین، آرنج حدود ۴۵ درجه.",
      tip:"سخت بود → زانو روی زمین. آسان → پا روی صندلی." },
    { id:"c2", name:"شنا الماسی",
      how:"دست‌ها زیر سینه نزدیک هم. تمرکز سه‌سر و وسط سینه.", tip:"دامنه کامل، آهسته." },
    { id:"c3", name:"شنا عریض",
      how:"دست‌ها پهن‌تر از شانه. کمر نینداز.", tip:"برای عرض سینه." },
    { id:"c4", name:"پوش‌آپ روی میز / دیوار",
      how:"دست روی لبه میز، بدن مورب.", tip:"مناسب مبتدی." },
  ],
  back: [
    { id:"k1", name:"سوپرمن", how:"روی شکم؛ دست و پا هم‌زمان بالا، ۲ ثانیه مکث.", tip:"گردن زیاد بالا نرود." },
    { id:"k2", name:"کشش با حوله روی در", how:"حوله دور دستگیره؛ بدن را بکش به سمت در.", tip:"در قفل باشد." },
    { id:"k3", name:"پرنده‌سگ", how:"چهار دست‌وپا؛ دست راست + پای چپ صاف، بعد عوض.", tip:"لگن نچرخد." },
    { id:"k4", name:"اسکاپولا پوش‌آپ", how:"پلانک روی دست؛ فقط شانه پایین/بالا بدون خم آرنج.", tip:"سلامت کتف." },
  ],
  leg: [
    { id:"l1", name:"اسکوات", how:"پا عرض شانه؛ مثل نشستن روی صندلی، پاشنه زمین.", tip:"زانو زیاد جلو نرود." },
    { id:"l2", name:"لانج", how:"یک پا جلو؛ زانوی عقب به زمین، بعد عوض.", tip:"تنه صاف." },
    { id:"l3", name:"پل باسن", how:"به پشت زانو خم؛ باسن بالا تا بدن صاف.", tip:"مکث بالا." },
    { id:"l4", name:"اسکوات به صندلی", how:"آرام بنشین روی صندلی و بلند شو.", tip:"مبتدی / زانو حساس." },
    { id:"l5", name:"کالف‌ریز", how:"روی پنجه بلند شو و پایین.", tip:"کنار دیوار." },
  ],
  shoulder: [
    { id:"s1", name:"پایک پوش‌آپ", how:"باسن بالا (V)؛ سر به سمت زمین پایین و بالا.", tip:"سخت بود زاویه کمتر." },
    { id:"s2", name:"نشر جانب با بطری", how:"بطری از بغل تا ارتفاع شانه.", tip:"تاب نده." },
    { id:"s3", name:"نشر جلو با بطری", how:"از جلو تا ارتفاع شانه.", tip:"کمر قوس برندارد." },
    { id:"s4", name:"چرخش خارجی شانه", how:"آرنج به پهلو؛ ساعد را از بدن دور کن.", tip:"پیشگیری آسیب." },
  ],
  core: [
    { id:"o1", name:"پلانک", how:"روی ساعد؛ بدن صاف، شکم سفت.", tip:"باسن نیاید بالا/پایین." },
    { id:"o2", name:"کرانچ", how:"شانه از زمین جدا؛ گردن نکش.", tip:"حرکت کنترل‌شده." },
    { id:"o3", name:"حشره مرده", how:"کمر به زمین بچسبد؛ دست و پای مخالف نزدیک زمین.", tip:"قوس کمر ممنوع." },
    { id:"o4", name:"کوهنورد", how:"پلانک؛ زانو یکی‌یکی به سینه.", tip:"ریتم ثابت." },
    { id:"o5", name:"ساید پلانک", how:"روی یک ساعد به پهلو؛ دو طرف.", tip:"مبتدی: زانو زمین." },
  ],
  full: [
    { id:"f1", name:"بورپی ساده", how:"اسکوات → پلانک → بلند شو. پرش اختیاری.", tip:"فشار مفاصل → بدون پرش." },
    { id:"f2", name:"جامپینگ جک", how:"بپر پا باز، دست بالا.", tip:"فرود نرم." },
    { id:"f3", name:"اسکوات + پرس بطری", how:"اسکوات؛ هنگام بلند شدن پرس بالای سر.", tip:"پا + شانه." },
  ],
};

const CAT_NAME = { all:"همه", full:"کل بدن", chest:"سینه", back:"پشت", leg:"پا", shoulder:"شانه", core:"میان‌تنه" };

function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1400)}
function pad(n){return String(n).padStart(2,"0")}
function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function load(){
  try{const r=localStorage.getItem(STORE);if(r)return JSON.parse(r)}catch(e){}
  return { profile:{}, sets:{}, plan:[] };
  // sets: { "2026-09-30": { "c1": 2, "l1": 3 } }  // تعداد ست انجام‌شده
}
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

let state = load();
let filter = "all";

function analyze(age,h,w){
  const bmi=w/Math.pow(h/100,2);
  let bmiLabel="نرمال";
  if(bmi<18.5)bmiLabel="کم‌وزن";
  else if(bmi<25)bmiLabel="نرمال";
  else if(bmi<30)bmiLabel="اضافه‌وزن";
  else bmiLabel="چاق";
  let level="intermediate";
  if(age<18)level="teen";
  else if(age<=35)level=bmi>=30?"beginner":"intermediate";
  else if(age<=50)level=bmi>=28?"beginner":"intermediate";
  else level="senior";
  if(bmi<18.5 && level==="intermediate")level="beginner";
  return {bmi,bmiLabel,level};
}

function setCount(level){
  return ({ teen:3, beginner:2, intermediate:3, senior:2 })[level] || 3;
}
function repsText(level, kind){
  const t={
    teen:{strength:"۱۰–۱۲ تکرار", core:"۳۰–۴۰ ثانیه", cardio:"۸–۱۰ تکرار"},
    beginner:{strength:"۸–۱۰ تکرار", core:"۲۰–۳۰ ثانیه", cardio:"۶–۸ تکرار"},
    intermediate:{strength:"۱۰–۱۵ تکرار", core:"۴۰–۶۰ ثانیه", cardio:"۱۰–۱۵ تکرار"},
    senior:{strength:"۸–۱۲ تکرار آرام", core:"۲۰–۳۰ ثانیه", cardio:"۶–۸ بدون پرش"},
  };
  return (t[level]||t.beginner)[kind];
}

function buildPlan(age,h,w){
  const a=analyze(age,h,w);
  const L=a.level;
  const sets=setCount(L);
  const plan=[];
  const pick=(cat,ids,kind)=>{
    ids.forEach(id=>{
      const base=LIB[cat].find(x=>x.id===id);
      if(!base)return;
      plan.push({
        ...base, cat, sets, kind,
        dose: sets+" ست × "+repsText(L,kind),
        level:L
      });
    });
  };
  if(L==="senior"||L==="beginner"){
    pick("chest",["c4","c1"],"strength");
    pick("back",["k3","k1"],"strength");
    pick("leg",["l4","l1","l3","l5"],"strength");
    pick("shoulder",["s4","s2"],"strength");
    pick("core",["o3","o1","o2"],"core");
    pick("full",["f3"],"cardio");
  }else if(L==="teen"){
    pick("chest",["c1","c3","c2"],"strength");
    pick("back",["k1","k3","k4"],"strength");
    pick("leg",["l1","l2","l3","l5"],"strength");
    pick("shoulder",["s1","s2","s3"],"strength");
    pick("core",["o1","o4","o2","o5"],"core");
    pick("full",["f2","f1"],"cardio");
  }else{
    pick("chest",["c1","c2","c3"],"strength");
    pick("back",["k1","k2","k3","k4"],"strength");
    pick("leg",["l1","l2","l3","l5"],"strength");
    pick("shoulder",["s1","s2","s3","s4"],"strength");
    pick("core",["o1","o2","o3","o4","o5"],"core");
    pick("full",["f1","f2","f3"],"cardio");
  }
  if(a.bmi>=30){
    return plan.filter(p=>p.id!=="f1"&&p.id!=="f2").map(p=>({
      ...p, note:"فرم مهم‌تر از سرعت؛ بدون پرش."
    }));
  }
  return plan;
}

function levelText(L){
  return ({
    teen:"رده نوجوان — فرم و عادت",
    beginner:"مبتدی — حجم کمتر",
    intermediate:"متوسط — برنامه کامل",
    senior:"احتیاط مفاصل — آرام و پایدار"
  })[L]||"";
}

function gen(){
  const age=+document.getElementById("age").value;
  const height=+document.getElementById("height").value;
  const weight=+document.getElementById("weight").value;
  if(!age||!height||!weight){toast("سن، قد و وزن را پر کن");return}
  if(age<12||age>80||height<120||height>220||weight<35||weight>200){toast("مقادیر نامعتبر");return}
  state.profile={age,height,weight};
  state.plan=buildPlan(age,height,weight);
  save();
  const a=analyze(age,height,weight);
  document.getElementById("bmiInfo").innerHTML=
    `BMI: <b>${a.bmi.toFixed(1)}</b> (${a.bmiLabel}) · <b>${levelText(a.level)}</b><br>هر تیک = ۱ ست · فقط برای <b>امروز</b>`;
  document.getElementById("levelHint").textContent=levelText(a.level);
  render();
  toast("برنامه ذخیره شد");
}

/** تعداد ست انجام‌شده امروز برای یک حرکت */
function getSetsDone(id){
  const k=todayKey();
  return (state.sets[k] && state.sets[k][id]) || 0;
}
/** تیک ست: فقط تا سقف setsTarget و فقط امروز */
function toggleSet(id, setIndex, maxSets){
  const k=todayKey();
  if(!state.sets[k]) state.sets[k]={};
  let cur = state.sets[k][id] || 0;
  // اگر روی ست پرشده زد → تا همان ست کم کن؛ اگر روی ست بعدی زد → پر کن
  if(setIndex < cur){
    state.sets[k][id] = setIndex; // مثلاً ست ۳ از ۳ پر بود و زد روی ۲ → می‌شود ۲
  } else {
    state.sets[k][id] = setIndex + 1;
  }
  if(state.sets[k][id] > maxSets) state.sets[k][id] = maxSets;
  if(state.sets[k][id] <= 0) delete state.sets[k][id];
  save();
  render();
}

function todayTotals(){
  const habits=state.plan||[];
  let done=0, total=0;
  habits.forEach(h=>{
    total += h.sets || 0;
    done += Math.min(getSetsDone(h.id), h.sets || 0);
  });
  return {done, total, pct: total?Math.round(done*100/total):0};
}

function faDate(){
  try{
    return new Date().toLocaleDateString("fa-IR",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  }catch(e){
    return todayKey();
  }
}

function render(){
  document.getElementById("todayDate").textContent = faDate();
  document.getElementById("todayTitle").textContent = "تمرین امروز";

  const ts=todayTotals();
  document.getElementById("todaySets").textContent = ts.done+" / "+ts.total+" ست";
  document.getElementById("todayRing").style.setProperty("--p", ts.pct);
  document.getElementById("todayPct").textContent = ts.pct+"%";

  const list=document.getElementById("list");
  list.innerHTML="";
  const habits=(state.plan||[]).filter(h=>filter==="all"||h.cat===filter);
  if(!habits.length){
    list.innerHTML=`<div style="color:var(--muted);text-align:center;padding:24px">سن، قد و وزن را بده و برنامه بساز.</div>`;
    return;
  }

  habits.forEach(h=>{
    const max = h.sets || 3;
    const done = Math.min(getSetsDone(h.id), max);
    const setsHtml = Array.from({length:max},(_,i)=>{
      const on = i < done;
      return `<div class="set ${on?"done":""}" data-id="${h.id}" data-i="${i}" data-max="${max}">${on?"✓":(i+1)}</div>`;
    }).join("");

    const el=document.createElement("div");
    el.className="habit";
    el.innerHTML=`
      <div class="top">
        <div>
          <div class="name">${h.name}</div>
          <div class="meta">${h.dose}${h.note?" · "+h.note:""}</div>
        </div>
        <span class="tag">${CAT_NAME[h.cat]}</span>
      </div>
      <div class="set-label">ست‌های امروز: <b style="color:var(--text)">${done}</b> از <b style="color:var(--text)">${max}</b> — هر تیک یک ست</div>
      <div class="sets">${setsHtml}</div>
      <button type="button" class="detail-btn" data-detail="${h.id}">جزئیات حرکت</button>`;
    list.appendChild(el);
  });

  list.querySelectorAll(".set").forEach(el=>{
    el.onclick=()=>{
      toggleSet(el.dataset.id, +el.dataset.i, +el.dataset.max);
    };
  });
  list.querySelectorAll("[data-detail]").forEach(b=>{
    b.onclick=()=>{
      const h=state.plan.find(x=>x.id===b.dataset.detail);
      if(!h)return;
      document.getElementById("mTitle").textContent=h.name;
      document.getElementById("mBody").textContent=
        "دسته: "+CAT_NAME[h.cat]+"\nامروز: "+h.dose+"\n\nنحوه اجرا:\n"+h.how+"\n\nنکته:\n"+h.tip+(h.note?"\n\n"+h.note:"");
      document.getElementById("modal").classList.add("on");
    };
  });
}

document.getElementById("tabs").onclick=e=>{
  const b=e.target.closest("button[data-cat]"); if(!b)return;
  filter=b.dataset.cat;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render();
};
document.getElementById("btnGen").onclick=gen;
document.getElementById("btnResetToday").onclick=()=>{
  if(!confirm("ست‌های امروز پاک شود؟"))return;
  delete state.sets[todayKey()];
  save(); render(); toast("ست‌های امروز پاک شد");
};
document.getElementById("mClose").onclick=()=>document.getElementById("modal").classList.remove("on");

if(state.profile&&state.profile.age){
  document.getElementById("age").value=state.profile.age;
  document.getElementById("height").value=state.profile.height;
  document.getElementById("weight").value=state.profile.weight;
  if(state.plan&&state.plan.length){
    const a=analyze(state.profile.age,state.profile.height,state.profile.weight);
    document.getElementById("bmiInfo").innerHTML=
      `BMI: <b>${a.bmi.toFixed(1)}</b> (${a.bmiLabel}) · <b>${levelText(a.level)}</b>`;
    document.getElementById("levelHint").textContent=levelText(a.level);
  }
}
render();
// هر بار باز شدن = روز سیستم؛ نیمه‌شب خودکار روز جدید
setInterval(()=>{ render(); }, 60*1000);
</script>
</body>
</html>
