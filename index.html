<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SELF KiAN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Vazirmatn:wght@400;600;700&display=swap');
    :root, [data-theme="guts"] {
      --bg:#030304; --accent:#ff1a2a; --gold:#b8860b; --bone:#e8dcc8; --dim:#6a645c;
      --panel:#0e0a0a; --line:rgba(180,20,20,.45); --glow:rgba(180,0,0,.5);
      --grad:linear-gradient(180deg,#ffe8c8,#c45c20,#8a0000); --chip:linear-gradient(135deg,#5a0000,#1a0000);
      --card:linear-gradient(165deg,#1a1010,#050303);
    }
    [data-theme="griffith"] {
      --bg:#08090f; --accent:#e8eefc; --gold:#f0e0b0; --bone:#f7f4ef; --dim:#9aa0b4;
      --panel:#0e1018; --line:rgba(200,210,255,.22); --glow:rgba(140,150,220,.35);
      --grad:linear-gradient(180deg,#fff,#f0e0b0,#a8b0ff); --chip:linear-gradient(135deg,#2a3048,#141820);
      --card:linear-gradient(165deg,#141822,#060810);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100%;background:var(--bg);color:var(--bone);font-family:Vazirmatn,system-ui,sans-serif}
    .top{display:flex;justify-content:space-between;padding:12px;gap:8px}
    .themes{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
    .themes button{border:0;background:transparent;color:var(--dim);padding:8px 14px;font-weight:800;font-family:inherit;cursor:pointer}
    .themes button.on{background:var(--chip);color:var(--bone)}
    .hero{text-align:center;padding:12px 16px}
    .hero h1{font-family:Cinzel,serif;font-size:1.5rem;letter-spacing:.15em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .hero p{color:var(--dim);font-size:.82rem;margin-top:8px}
    .gallows{height:96px;position:relative}
    .rope{position:absolute;top:0;left:50%;width:2px;height:22px;margin-left:-1px;background:#5a4030;transform-origin:top center;animation:sw 3.2s ease-in-out infinite}
    .hang{position:absolute;top:20px;left:50%;width:76px;height:76px;margin-left:-38px;transform-origin:top center;animation:sw 3.2s ease-in-out infinite}
    .hang img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
    @keyframes sw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .search{padding:8px 14px}
    .search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--bone);font-family:inherit}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 24px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer}
    .card:active{box-shadow:0 0 20px var(--glow)}
    .card .ic{font-size:1.4rem;margin-bottom:6px}
    .card .t{font-size:.88rem;font-weight:700}
    .detail{display:none;padding:12px 14px 28px}
    .detail.on{display:block}
    .back{background:var(--panel);border:1px solid var(--line);color:var(--bone);border-radius:10px;padding:8px 14px;font-family:inherit;margin-bottom:12px}
    .cmd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
    .cmd code{direction:ltr;display:inline-block;color:var(--accent);background:rgba(255,255,255,.06);padding:3px 8px;border-radius:6px;cursor:pointer}
    .cmd .d{color:var(--dim);font-size:.82rem;margin-top:6px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:9}
    .toast.on{opacity:1}
    .foot{text-align:center;color:var(--dim);font-size:.72rem;padding:8px 16px 28px}
    .foot b{color:var(--gold)}
    .hide{display:none!important}
  </style>
</head>
<body data-theme="guts">
  <div class="top">
    <div class="themes">
      <button type="button" id="guts" class="on">GUTS</button>
      <button type="button" id="griff">GRIFFITH</button>
    </div>
  </div>
  <div class="hero">
    <h1>SELF KiAN</h1>
    <p>راهنما · دستورات با نقطه · لمس برای کپی</p>
  </div>
  <div class="gallows">
    <div class="rope"></div>
    <div class="hang"><img src="guts.png" alt="" /></div>
  </div>
  <div class="search" id="sb"><input id="q" placeholder="جستجو..." /></div>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail">
    <button class="back" id="back">← برگشت</button>
    <h2 id="dt" style="margin-bottom:12px;font-size:1.05rem"></h2>
    <div id="db"></div>
  </div>
  <div class="foot"><b>KiAN</b><br>شروع کدنویسی از ۲۰۱۹</div>
  <div class="toast" id="toast">کپی شد</div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#030304"); tg.setBackgroundColor("#030304"); } catch(e){} }

    const S = [
      {i:"📊",t:"پنل",x:[[" .پنل","وضعیت و الماس"],[" .پینگ","تأخیر"],[" .آیدی","آیدی عددی"],[" .آمار","آمار"],[" .آپتایم","مدت روشن"]]},
      {i:"💎",t:"الماس",x:[[" .واریز 5000","واریز ادمین"],[" .پنل","موجودی"]]},
      {i:"⏰",t:"ساعت",x:[[" .تایم فامیلی روشن","فامیلی"],[" .تایم اسم روشن","اسم"],[" .بیو تاریخ روشن","تاریخ بیو"],[" .تایم روشن","کلی"],[" .لیست تایم","فونت‌ها"],[" .فونت تایم رندوم","رندوم"]]},
      {i:"✍️",t:"فونت پیام",x:[[" .فونت روشن","روشن"],[" .فونت خاموش","خاموش"],[" .لیست فونت","لیست"],[" .انتخاب فونت 5","انتخاب"]]},
      {i:"🛠",t:"ابزار",x:[[" .هوا تهران","هوا"],[" .حساب 25*4","حساب"],[" .ویکی متن","ویکی"],[" .آنلاین روشن","آنلاین"],[" .اسکرین","استیکر"],[" .ویس متن","ویس"]]},
      {i:"👁",t:"ویووانس",x:[[" .ویووانس روشن","روشن"],[" .ویووانس خاموش","خاموش"],[" .ویووانس","وضعیت"]]},
      {i:"👤",t:"پروفایل",x:[[" .نام","اسم"],[" .بیو","بیو"],[" .سیو پروفایل","پروفایل → Saved"]]},
      {i:"💾",t:"ذخیره",x:[[" .سیو","ریپلای"],[" .سیو مدیا روشن","مدیا"]]},
      {i:"👁",t:"اتو",x:[[" .سین روشن","سین"],[" .سین خاموش","قطع"],[" .پاسخ متن","پاسخ"]]},
      {i:"❤️",t:"ری‌اکشن",x:[[" .ری‌اکشن ❤️","ثبت"],[" .ری‌اکشن خاموش","قطع"]]},
      {i:"👿",t:"دشمن",x:[[" .دشمن","ثبت"],[" .حذف دشمن","حذف"],[" .فحش متن","فحش"]]},
      {i:"🔇",t:"سکوت",x:[[" .سکوت","سکوت"],[" .حذف سکوت","لغو"]]},
      {i:"🔴",t:"ریپورتر",x:[[" .تنظیم ریپورت","ثبت هدف"],[" .تنظیم متن ریپورت ...","متن"],[" .ریپورت","ارسال تا ۸"],[" .وضعیت ریپورت","وضعیت"]]},
      {i:"📨",t:"اسپم",x:[[" .اسپم 20 متن","اسپم"],[" .اسپم‌استاپ","ایست"]]},
      {i:"✨",t:"انیمیشن",x:[[" .عشق",""],[" .آتش",""],[" .ماتریکس",""]]},
      {i:"📡",t:"زنده",x:[[" .زنده تایپ",""],[" .زنده ویس",""],[" .زنده خاموش",""]]},
    ];

    const grid=document.getElementById("grid"), detail=document.getElementById("detail");
    const dt=document.getElementById("dt"), db=document.getElementById("db"), sb=document.getElementById("sb");

    function toast(){const e=document.getElementById("toast");e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1200)}
    function copy(s){
      const t=s.trim();
      if(navigator.clipboard) navigator.clipboard.writeText(t).then(toast).catch(()=>{});
      else toast();
    }
    function draw(f=""){
      grid.innerHTML="";
      f=f.trim();
      S.forEach((s,i)=>{
        if(f && !s.t.includes(f) && !s.x.some(c=>c[0].includes(f)||c[1].includes(f))) return;
        const el=document.createElement("div");
        el.className="card";
        el.innerHTML=`<div class="ic">${s.i}</div><div class="t">${s.t}</div>`;
        el.onclick=()=>open(s);
        grid.appendChild(el);
      });
    }
    function open(s){
      grid.classList.add("hide"); sb.classList.add("hide"); detail.classList.add("on");
      dt.textContent=s.i+" "+s.t;
      db.innerHTML=s.x.map(c=>`<div class="cmd"><code>${c[0].trim()}</code><div class="d">${c[1]||""}</div></div>`).join("");
      db.querySelectorAll("code").forEach(el=>el.onclick=()=>copy(el.textContent));
      if(tg) try{tg.BackButton.show()}catch(e){}
    }
    function home(){
      detail.classList.remove("on"); grid.classList.remove("hide"); sb.classList.remove("hide");
      if(tg) try{tg.BackButton.hide()}catch(e){}
    }
    document.getElementById("back").onclick=home;
    if(tg) try{tg.BackButton.onClick(home)}catch(e){}
    document.getElementById("q").oninput=e=>draw(e.target.value);
    document.getElementById("guts").onclick=()=>{document.body.setAttribute("data-theme","guts");document.getElementById("guts").classList.add("on");document.getElementById("griff").classList.remove("on");if(tg)try{tg.setHeaderColor("#030304");tg.setBackgroundColor("#030304")}catch(e){}};
    document.getElementById("griff").onclick=()=>{document.body.setAttribute("data-theme","griffith");document.getElementById("griff").classList.add("on");document.getElementById("guts").classList.remove("on");if(tg)try{tg.setHeaderColor("#08090f");tg.setBackgroundColor("#08090f")}catch(e){}};
    draw();
  </script>
</body>
</html>
