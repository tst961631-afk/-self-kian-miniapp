<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Discipline — ترکر تمرین</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --line: #2a2f3a;
      --text: #eef1f6;
      --muted: #8b93a7;
      --jaw: #6c8cff;
      --body: #3ecf8e;
      --cal: #ffb020;
      --ok: #3ecf8e;
      --bad: #ff5c6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Vazirmatn", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 88px;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15,17,21,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px 10px;
    }
    header h1 {
      font-size: 1.15rem; font-weight: 800;
      display: flex; align-items: center; gap: 8px;
    }
    header h1 span { color: var(--ok); font-size: .95rem; }
    .meta {
      display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
    }
    .meta select, .meta button {
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 12px; font-family: inherit; font-size: .85rem;
    }
    .ring-row {
      display: grid; grid-template-columns: 1fr 90px; gap: 12px;
      padding: 14px 16px 0;
    }
    .stat-card, .ring-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 14px;
    }
    .stat-card .lbl { color: var(--muted); font-size: .78rem; }
    .stat-card .val { font-size: 1.6rem; font-weight: 800; margin-top: 4px; }
    .ring-card { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring {
      width: 64px; height: 64px; border-radius: 50%;
      background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0);
      display: grid; place-items: center;
    }
    .ring i {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--card); display: grid; place-items: center;
      font-size: .78rem; font-weight: 800;
    }
    .tabs {
      display: flex; gap: 8px; padding: 14px 16px; overflow-x: auto;
    }
    .tabs button {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
      color: var(--muted); border-radius: 999px; padding: 8px 14px;
      font-family: inherit; font-size: .82rem; font-weight: 700; cursor: pointer;
    }
    .tabs button.on { color: #0b0d10; }
    .tabs button[data-cat="jaw"].on { background: var(--jaw); border-color: var(--jaw); }
    .tabs button[data-cat="body"].on { background: var(--body); border-color: var(--body); }
    .tabs button[data-cat="cal"].on { background: var(--cal); border-color: var(--cal); color: #1a1200; }
    .tabs button[data-cat="all"].on { background: var(--text); }

    .week-bar {
      display: grid; grid-template-columns: 1.4fr repeat(7, 1fr);
      gap: 4px; padding: 0 16px 8px; font-size: .72rem; color: var(--muted);
      text-align: center;
    }
    .week-bar b { text-align: right; color: var(--text); font-weight: 700; }

    .list { padding: 0 12px 20px; }
    .habit {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 12px; margin-bottom: 10px;
    }
    .habit .top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .habit .name { font-weight: 700; font-size: .92rem; }
    .habit .sub { color: var(--muted); font-size: .75rem; margin-top: 2px; }
    .tag {
      font-size: .7rem; font-weight: 800; padding: 4px 8px; border-radius: 999px;
    }
    .tag.jaw { background: rgba(108,140,255,.18); color: var(--jaw); }
    .tag.body { background: rgba(62,207,142,.18); color: var(--body); }
    .tag.cal { background: rgba(255,176,32,.18); color: var(--cal); }

    .days {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    }
    .day {
      aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line);
      background: #12151c; display: grid; place-items: center;
      font-size: .7rem; color: var(--muted); cursor: pointer;
      user-select: none; transition: .15s;
    }
    .day.done {
      background: var(--ok); border-color: var(--ok); color: #062016; font-weight: 800;
    }
    .day.today { outline: 2px solid #fff3; }
    .day.future { opacity: .35; pointer-events: none; }

    .section-title {
      padding: 6px 16px 10px; font-size: .8rem; color: var(--muted); font-weight: 700;
    }

    .bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15,17,21,.95); border-top: 1px solid var(--line);
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .bottom button {
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 12px; padding: 12px 8px; font-family: inherit;
      font-size: .8rem; font-weight: 700; cursor: pointer;
    }
    .bottom button.primary {
      background: linear-gradient(135deg, #3ecf8e, #2aa56e);
      border-color: transparent; color: #062016;
    }

    .modal {
      position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal.on { display: flex; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--card);
      border-radius: 20px 20px 0 0; padding: 18px 16px 28px;
      border: 1px solid var(--line);
    }
    .sheet h3 { margin-bottom: 12px; font-size: 1rem; }
    .sheet label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 6px; }
    .sheet input, .sheet select, .sheet textarea {
      width: 100%; background: #12151c; border: 1px solid var(--line);
      color: var(--text); border-radius: 12px; padding: 12px; font-family: inherit;
    }
    .sheet .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .sheet .actions button {
      border: 0; border-radius: 12px; padding: 12px; font-family: inherit; font-weight: 700;
    }
    .sheet .cancel { background: #222733; color: var(--text); }
    .sheet .save { background: var(--ok); color: #062016; }

    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #222733; border: 1px solid var(--line); color: var(--text);
      padding: 10px 16px; border-radius: 999px; font-size: .82rem;
      opacity: 0; transition: .25s; z-index: 60; pointer-events: none;
    }
    .toast.on { opacity: 1; }

    .progress-list { padding: 0 16px 16px; }
    .prog-item {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      margin-bottom: 10px; font-size: .84rem;
    }
    .bar {
      height: 8px; background: #12151c; border-radius: 99px; overflow: hidden; margin-top: 4px;
    }
    .bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  </style>
</head>
<body>
  <header>
    <h1>Discipline <span>↗</span></h1>
    <div class="meta">
      <select id="month"></select>
      <select id="year"></select>
      <button type="button" id="btnToday">امروز</button>
    </div>
  </header>

  <div class="ring-row">
    <div class="stat-card">
      <div class="lbl">پیشرفت این ماه</div>
      <div class="val" id="monthPct">0%</div>
      <div class="lbl" id="monthCount" style="margin-top:6px">0 / 0 تیک</div>
    </div>
    <div class="ring-card">
      <div class="ring" id="todayRing" style="--p:0"><i id="todayPct">0%</i></div>
      <div class="lbl" style="margin-top:6px;font-size:.72rem">امروز</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" data-cat="all" class="on">همه</button>
    <button type="button" data-cat="jaw">زاویه فک</button>
    <button type="button" data-cat="body">بدنی</button>
    <button type="button" data-cat="cal">کلستنیک</button>
  </div>

  <div class="week-bar">
    <b id="weekLabel">هفته</b>
    <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
  </div>

  <div class="section-title" id="sectionTitle">تمرین‌ها</div>
  <div class="list" id="list"></div>

  <div class="progress-list" id="progBox"></div>

  <div class="bottom">
    <button type="button" id="btnPrev">هفته قبل</button>
    <button type="button" class="primary" id="btnAdd">+ تمرین</button>
    <button type="button" id="btnNext">هفته بعد</button>
  </div>

  <div class="modal" id="modal">
    <div class="sheet">
      <h3 id="modalTitle">تمرین جدید</h3>
      <label>نام تمرین</label>
      <input id="fName" placeholder="مثلاً میوینگ ۲۰ دقیقه" />
      <label>دسته</label>
      <select id="fCat">
        <option value="jaw">زاویه فک</option>
        <option value="body">تمرین بدنی</option>
        <option value="cal">کلستنیک</option>
      </select>
      <label>توضیح کوتاه (اختیاری)</label>
      <input id="fSub" placeholder="زیر‌بخش / توضیح" />
      <div class="actions">
        <button type="button" class="cancel" id="fCancel">انصراف</button>
        <button type="button" class="save" id="fSave">ذخیره</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor("#0f1115"); tg.setBackgroundColor("#0f1115"); } catch (e) {}
    }

    const STORE = "discipline_habits_v1";
    const CAT = {
      jaw: { name: "زاویه فک", color: "jaw" },
      body: { name: "بدنی", color: "body" },
      cal: { name: "کلستنیک", color: "cal" },
    };

    // پیش‌فرض — قابل ویرایش/حذف
    const DEFAULTS = [
      { id: "j1", cat: "jaw", name: "میوینگ", sub: "۲۰ دقیقه" },
      { id: "j2", cat: "jaw", name: "آدامس سفت", sub: "۱۵ دقیقه" },
      { id: "j3", cat: "jaw", name: "تمرین زبان به سقف", sub: "۳ ست" },
      { id: "b1", cat: "body", name: "پیاده‌روی", sub: "۳۰ دقیقه" },
      { id: "b2", cat: "body", name: "کششی / موبیلیتی", sub: "۱۰ دقیقه" },
      { id: "b3", cat: "body", name: "کر / شکم", sub: "۳ ست" },
      { id: "c1", cat: "cal", name: "پوش‌آپ", sub: "۳×۱۲" },
      { id: "c2", cat: "cal", name: "اسکوات", sub: "۳×۱۵" },
      { id: "c3", cat: "cal", name: "پلانک", sub: "۳×۴۵ث" },
      { id: "c4", cat: "cal", name: "بارفیکس / افقی", sub: "تا توان" },
    ];

    let state = load();
    let view = new Date();
    let weekOffset = 0; // 0 = هفته جاری نسبت به ماه انتخابی
    let filter = "all";
    let editId = null;

    function load() {
      try {
        const raw = localStorage.getItem(STORE);
        if (raw) {
          const d = JSON.parse(raw);
          if (d.habits && d.checks) return d;
        }
      } catch (e) {}
      return { habits: DEFAULTS.map(x => ({ ...x })), checks: {} };
    }
    function save() {
      localStorage.setItem(STORE, JSON.stringify(state));
    }
    function toast(m) {
      const el = document.getElementById("toast");
      el.textContent = m;
      el.classList.add("on");
      setTimeout(() => el.classList.remove("on"), 1400);
    }

    // ماه شمسی تقریبی برای انتخاب (نمایش) — ذخیره با کلید میلادی YYYY-MM-DD
    function pad(n) { return String(n).padStart(2, "0"); }
    function key(d) {
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }
    function startOfWeek(d) {
      // شنبه = شروع هفته
      const x = new Date(d);
      const day = x.getDay(); // 0 sun ... 6 sat
      const diff = (day === 6) ? 0 : day + 1;
      x.setDate(x.getDate() - diff);
      x.setHours(0,0,0,0);
      return x;
    }
    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return x;
    }

    function fillMonthYear() {
      const mSel = document.getElementById("month");
      const ySel = document.getElementById("year");
      const months = ["ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"];
      mSel.innerHTML = months.map((m, i) => `<option value="${i}">${m}</option>`).join("");
      const y = new Date().getFullYear();
      ySel.innerHTML = [y - 1, y, y + 1].map(v => `<option value="${v}">${v}</option>`).join("");
      mSel.value = view.getMonth();
      ySel.value = view.getFullYear();
    }

    function currentWeekDays() {
      // هفته‌ای که شامل «view + weekOffset*7» است
      const base = new Date(view.getFullYear(), view.getMonth(), Math.min(view.getDate(), 28));
      const center = addDays(base, weekOffset * 7);
      const start = startOfWeek(center);
      return Array.from({ length: 7 }, (_, i) => addDays(start, i));
    }

    function isChecked(habitId, dateObj) {
      const k = key(dateObj);
      return !!(state.checks[k] && state.checks[k][habitId]);
    }
    function toggle(habitId, dateObj) {
      const k = key(dateObj);
      if (!state.checks[k]) state.checks[k] = {};
      state.checks[k][habitId] = !state.checks[k][habitId];
      if (!state.checks[k][habitId]) delete state.checks[k][habitId];
      save();
      render();
    }

    function monthStats() {
      const y = view.getFullYear(), m = view.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const habits = state.habits;
      let done = 0, total = habits.length * daysInMonth;
      for (let d = 1; d <= daysInMonth; d++) {
        const k = key(new Date(y, m, d));
        const map = state.checks[k] || {};
        habits.forEach(h => { if (map[h.id]) done++; });
      }
      return { done, total, pct: total ? Math.round(done * 100 / total) : 0 };
    }
    function todayStats() {
      const t = new Date();
      const k = key(t);
      const map = state.checks[k] || {};
      const habits = state.habits;
      let done = 0;
      habits.forEach(h => { if (map[h.id]) done++; });
      const pct = habits.length ? Math.round(done * 100 / habits.length) : 0;
      return { done, total: habits.length, pct };
    }

    function render() {
      const days = currentWeekDays();
      const today = new Date(); today.setHours(0,0,0,0);
      document.getElementById("weekLabel").textContent =
        days[0].getDate() + "–" + days[6].getDate();

      const ms = monthStats();
      document.getElementById("monthPct").textContent = ms.pct + "%";
      document.getElementById("monthCount").textContent = ms.done + " / " + ms.total + " تیک";
      const ts = todayStats();
      document.getElementById("todayRing").style.setProperty("--p", ts.pct);
      document.getElementById("todayPct").textContent = ts.pct + "%";

      const list = document.getElementById("list");
      list.innerHTML = "";
      const habits = state.habits.filter(h => filter === "all" || h.cat === filter);
      document.getElementById("sectionTitle").textContent =
        filter === "all" ? "همه تمرین‌ها" : "دسته: " + CAT[filter].name;

      if (!habits.length) {
        list.innerHTML = `<div style="color:var(--muted);padding:20px;text-align:center">تمرینی نیست. با «+ تمرین» اضافه کن.</div>`;
      }

      habits.forEach(h => {
        const el = document.createElement("div");
        el.className = "habit";
        const daysHtml = days.map(d => {
          const done = isChecked(h.id, d);
          const future = d > today;
          const isToday = d.getTime() === today.getTime();
          return `<div class="day ${done?"done":""} ${future?"future":""} ${isToday?"today":""}" data-id="${h.id}" data-k="${key(d)}">${done?"✓":d.getDate()}</div>`;
        }).join("");
        el.innerHTML = `
          <div class="top">
            <div>
              <div class="name">${h.name}</div>
              <div class="sub">${h.sub || CAT[h.cat].name}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <span class="tag ${h.cat}">${CAT[h.cat].name}</span>
              <button type="button" data-del="${h.id}" style="border:0;background:#2a2030;color:#f88;border-radius:8px;padding:6px 8px;font-size:.72rem;font-family:inherit">حذف</button>
            </div>
          </div>
          <div class="days">${daysHtml}</div>`;
        list.appendChild(el);
      });

      list.querySelectorAll(".day:not(.future)").forEach(d => {
        d.onclick = () => {
          const id = d.getAttribute("data-id");
          const [y,m,dd] = d.getAttribute("data-k").split("-").map(Number);
          toggle(id, new Date(y, m - 1, dd));
        };
      });
      list.querySelectorAll("[data-del]").forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute("data-del");
          if (!confirm("حذف این تمرین؟")) return;
          state.habits = state.habits.filter(h => h.id !== id);
          save(); render(); toast("حذف شد");
        };
      });

      // پیشرفت هر عادت در ماه
      const prog = document.getElementById("progBox");
      const y = view.getFullYear(), m = view.getMonth();
      const dim = new Date(y, m + 1, 0).getDate();
      prog.innerHTML = `<div class="section-title">پیشرفت ماهانه هر تمرین</div>` + habits.map(h => {
        let c = 0;
        for (let d = 1; d <= dim; d++) {
          if (isChecked(h.id, new Date(y, m, d))) c++;
        }
        const p = Math.round(c * 100 / dim);
        return `<div class="prog-item"><div>${h.name}<div class="bar"><i style="width:${p}%"></i></div></div><div>${c}/${dim}</div></div>`;
      }).join("");
    }

    // UI events
    document.getElementById("tabs").onclick = (e) => {
      const b = e.target.closest("button[data-cat]");
      if (!b) return;
      filter = b.dataset.cat;
      document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
      render();
    };
    document.getElementById("btnPrev").onclick = () => { weekOffset--; render(); };
    document.getElementById("btnNext").onclick = () => { weekOffset++; render(); };
    document.getElementById("btnToday").onclick = () => {
      view = new Date(); weekOffset = 0;
      fillMonthYear(); render();
    };
    document.getElementById("month").onchange = (e) => {
      view.setMonth(+e.target.value); weekOffset = 0; render();
    };
    document.getElementById("year").onchange = (e) => {
      view.setFullYear(+e.target.value); weekOffset = 0; render();
    };

    const modal = document.getElementById("modal");
    document.getElementById("btnAdd").onclick = () => {
      editId = null;
      document.getElementById("modalTitle").textContent = "تمرین جدید";
      document.getElementById("fName").value = "";
      document.getElementById("fSub").value = "";
      document.getElementById("fCat").value = filter === "all" ? "jaw" : filter;
      modal.classList.add("on");
    };
    document.getElementById("fCancel").onclick = () => modal.classList.remove("on");
    document.getElementById("fSave").onclick = () => {
      const name = document.getElementById("fName").value.trim();
      if (!name) return toast("نام لازم است");
      const cat = document.getElementById("fCat").value;
      const sub = document.getElementById("fSub").value.trim();
      state.habits.push({ id: "h" + Date.now(), cat, name, sub });
      save();
      modal.classList.remove("on");
      render();
      toast("ذخیره شد");
    };

    fillMonthYear();
    render();
  </script>
</body>
</html>
