<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Discipline — بدنسازی خانگی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
    :root {
      --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --text:#eef1f6; --muted:#8b93a7;
      --ok:#3ecf8e; --accent:#6c8cff; --warn:#ffb020; --bad:#ff5c6a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:96px}
    header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
    header h1{font-size:1.12rem;font-weight:800}
    header h1 span{color:var(--ok);font-size:.9rem}
    .subh{color:var(--muted);font-size:.8rem;margin-top:4px}
    .ring-row{display:grid;grid-template-columns:1fr 96px;gap:12px;padding:14px 16px 0}
    .stat-card,.ring-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    .stat-card .lbl{color:var(--muted);font-size:.75rem}
    .stat-card .val{font-size:1.45rem;font-weight:800;margin-top:4px}
    .ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:0 auto}
    .ring i{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.75rem;font-weight:800}
    .profile{margin:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    .profile .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .profile label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px}
    .profile input{width:100%;background:#12151c;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-family:inherit}
    .profile .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .btn{border:0;border-radius:12px;padding:11px 14px;font-family:inherit;font-weight:700;font-size:.84rem;cursor:pointer}
    .btn.ok{background:var(--ok);color:#062016}
    .btn.ghost{background:#222733;color:var(--text);border:1px solid var(--line)}
    .bmi{margin-top:10px;font-size:.82rem;color:var(--muted);line-height:1.7}
    .bmi b{color:var(--text)}
    .tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
    .tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font-family:inherit;font-size:.8rem;font-weight:700}
    .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
    .week-bar{display:grid;grid-template-columns:1.3fr repeat(7,1fr);gap:4px;padding:0 16px 8px;font-size:.7rem;color:var(--muted);text-align:center}
    .week-bar b{text-align:right;color:var(--text)}
    .list{padding:0 12px 12px}
    .habit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
    .habit .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
    .habit .name{font-weight:800;font-size:.92rem}
    .habit .meta{color:var(--muted);font-size:.75rem;margin-top:3px;line-height:1.5}
    .tag{font-size:.68rem;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(108,140,255,.15);color:var(--accent);white-space:nowrap}
    .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
    .day{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#12151c;display:grid;place-items:center;font-size:.68rem;color:var(--muted);cursor:pointer}
    .day.done{background:var(--ok);border-color:var(--ok);color:#062016;font-weight:800}
    .day.today{outline:2px solid #ffffff33}
    .day.future{opacity:.35;pointer-events:none}
    .detail-btn{border:0;background:#222733;color:var(--text);border-radius:8px;padding:6px 10px;font-size:.72rem;font-family:inherit;margin-top:8px}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
    .bottom button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 8px;font-family:inherit;font-size:.8rem;font-weight:700}
    .bottom .primary{background:linear-gradient(135deg,#3ecf8e,#2aa56e);border-color:transparent;color:#062016}
    .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
    .modal.on{display:flex}
    .sheet{width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px 28px;border:1px solid var(--line)}
    .sheet h3{margin-bottom:10px}
    .sheet p{color:var(--muted);font-size:.88rem;line-height:1.85;white-space:pre-line}
    .sheet .close{margin-top:14px;width:100%;background:#222733;color:var(--text);border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:700}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222733;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:.82rem;opacity:0;transition:.25s;z-index:60}
    .toast.on{opacity:1}
    .hint{padding:0 16px 8px;color:var(--muted);font-size:.78rem;line-height:1.6}
  </style>
</head>
<body>
  <header>
    <h1>Discipline <span>↗</span> بدنسازی خانگی</h1>
    <div class="subh">بر اساس سن · قد · وزن — تیک روزانه + ذخیره</div>
  </header>

  <div class="profile" id="profileBox">
    <div class="grid">
      <div><label>سن (سال)</label><input id="age" type="number" min="12" max="80" placeholder="25" /></div>
      <div><label>قد (سانتی‌متر)</label><input id="height" type="number" min="120" max="220" placeholder="175" /></div>
      <div><label>وزن (کیلو)</label><input id="weight" type="number" min="35" max="200" placeholder="70" /></div>
    </div>
    <div class="row">
      <button class="btn ok" type="button" id="btnGen">ساخت / به‌روز برنامه</button>
      <button class="btn ghost" type="button" id="btnReset">پاک کردن تیک‌ها</button>
    </div>
    <div class="bmi" id="bmiInfo">سن، قد و وزن را وارد کن تا برنامه بسازد.</div>
  </div>

  <div class="ring-row">
    <div class="stat-card">
      <div class="lbl">پیشرفت این ماه</div>
      <div class="val" id="monthPct">0%</div>
      <div class="lbl" id="monthCount" style="margin-top:6px">۰ تیک</div>
    </div>
    <div class="ring-card">
      <div class="ring" id="todayRing" style="--p:0"><i id="todayPct">0%</i></div>
      <div class="lbl" style="margin-top:6px;font-size:.72rem;text-align:center">امروز</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" data-cat="all" class="on">همه</button>
    <button type="button" data-cat="full">کل بدن</button>
    <button type="button" data-cat="chest">سینه</button>
    <button type="button" data-cat="back">پشت</button>
    <button type="button" data-cat="leg">پا</button>
    <button type="button" data-cat="shoulder">شانه</button>
    <button type="button" data-cat="core">میان‌تنه</button>
  </div>

  <p class="hint" id="levelHint"></p>
  <div class="week-bar"><b id="weekLabel">هفته</b><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div>
  <div class="list" id="list"></div>

  <div class="bottom">
    <button type="button" id="btnPrev">هفته قبل</button>
    <button type="button" class="primary" id="btnToday">امروز</button>
    <button type="button" id="btnNext">هفته بعد</button>
  </div>

  <div class="modal" id="modal">
    <div class="sheet">
      <h3 id="mTitle">جزئیات</h3>
      <p id="mBody"></p>
      <button class="close" type="button" id="mClose">بستن</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0f1115"); tg.setBackgroundColor("#0f1115"); } catch(e){} }

  full: [
    { id:"f1", name:"بورپی ساده‌شده",

};

const CAT_NAME = {
  all:"همه", full:"کل بدن", chest:"سینه", back:"پشت", leg:"پا", shoulder:"شانه", core:"میان‌تنه"
};

function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1400)}
function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function startOfWeek(d){const x=new Date(d);const day=x.getDay();const diff=day===6?0:day+1;x.setDate(x.getDate()-diff);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

function load(){
  try{const r=localStorage.getItem(STORE);if(r)return JSON.parse(r)}catch(e){}
  return { profile:{}, checks:{}, plan:[] };
}
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

let state = load();
let view = new Date();
let weekOffset = 0;
let filter = "all";

/** سطح بر اساس سن و BMI */
function analyze(age, h, w){
  const bmi = w / Math.pow(h/100, 2);
  let bmiLabel = "نرمال";
  if (bmi < 18.5) bmiLabel = "کم‌وزن";
  else if (bmi < 25) bmiLabel = "نرمال";
  else if (bmi < 30) bmiLabel = "اضافه‌وزن";
  else bmiLabel = "چاق";

  // سطح: beginner / intermediate / advanced — و اصلاح برای سن
  let level = "intermediate";
  if (age < 18) level = "teen";
  else if (age <= 35) level = bmi >= 30 ? "beginner" : "intermediate";
  else if (age <= 50) level = bmi >= 28 ? "beginner" : "intermediate";
  else level = "senior";

  if (bmi < 18.5 && level === "intermediate") level = "beginner";

  return { bmi, bmiLabel, level };
}

function setsFor(level, kind){
  // kind: strength | core | cardio
  const table = {
    teen:        { strength:"۳ ست × ۱۰–۱۲", core:"۳×۳۰–۴۰ث / ۱۲ تکرار", cardio:"۸–۱۰ تکرار آرام" },
    beginner:    { strength:"۲–۳ ست × ۸–۱۰", core:"۲–۳×۲۰–۳۰ث", cardio:"۶–۸ تکرار" },
    intermediate:{ strength:"۳–۴ ست × ۱۰–۱۵", core:"۳×۴۰–۶۰ث", cardio:"۱۰–۱۵ تکرار" },
    senior:      { strength:"۲–۳ ست × ۸–۱۲ آرام", core:"۲×۲۰–۳۰ث", cardio:"۶–۸ بدون پرش" },
  };
  return (table[level] || table.beginner)[kind];
}

function buildPlan(age, h, w){
  const a = analyze(age, h, w);
  const L = a.level;
  const plan = [];

  const pick = (cat, ids, kind) => {
    ids.forEach(id => {
      const base = LIB[cat].find(x => x.id === id);
      if (!base) return;
      plan.push({
        ...base,
        cat,
        dose: setsFor(L, kind),
        level: L,
      });
    });
  };

  // انتخاب تمرین بر اساس سطح
  if (L === "senior" || L === "beginner") {
    pick("chest", ["c4","c1"], "strength");
    pick("back", ["k3","k1"], "strength");
    pick("leg", ["l4","l1","l3","l5"], "strength");
    pick("shoulder", ["s4","s2"], "strength");
    pick("core", ["o3","o1","o2"], "core");
    pick("full", ["f3"], "cardio");
  } else if (L === "teen") {
    pick("chest", ["c1","c3","c2"], "strength");
    pick("back", ["k1","k3","k4"], "strength");
    pick("leg", ["l1","l2","l3","l5"], "strength");
    pick("shoulder", ["s1","s2","s3"], "strength");
    pick("core", ["o1","o4","o2","o5"], "core");
    pick("full", ["f2","f1"], "cardio");
  } else {
    // intermediate
    pick("chest", ["c1","c2","c3"], "strength");
    pick("back", ["k1","k2","k3","k4"], "strength");
    pick("leg", ["l1","l2","l3","l5"], "strength");
    pick("shoulder", ["s1","s2","s3","s4"], "strength");
    pick("core", ["o1","o2","o3","o4","o5"], "core");
    pick("full", ["f1","f2","f3"], "cardio");
  }

  // اگر BMI بالا: کم کردن پرشی و تاکید بر فرم
  if (a.bmi >= 30) {
    return plan.filter(p => p.id !== "f1" && p.id !== "f2").map(p => ({
      ...p,
      dose: p.dose + " · فرم مهم‌تر از تعداد",
      note: "به‌خاطر وزن بدن، دامنه کنترل‌شده و بدون پرش پیشنهادی است."
    }));
  }
  if (a.bmi < 18.5) {
    return plan.map(p => ({
      ...p,
      note: (p.note || "") + " هدف: قدرت و ساخت عضله؛ بعد از تمرین وعده پروتئین‌دار."
    }));
  }
  return plan;
}

function levelText(L){
  return ({
    teen:"رده نوجوان — تمرکز روی فرم و عادت",
    beginner:"مبتدی / شروع مجدد — حجم کمتر، کیفیت بیشتر",
    intermediate:"متوسط — حجم کامل خانگی",
    senior:"بالای ۵۰ / احتیاط مفاصل — آرام و پایدار"
  })[L] || "";
}

function gen(){
  const age = +document.getElementById("age").value;
  const height = +document.getElementById("height").value;
  const weight = +document.getElementById("weight").value;
  if (!age || !height || !weight){ toast("سن، قد و وزن را پر کن"); return; }
  if (age<12||age>80||height<120||height>220||weight<35||weight>200){ toast("مقادیر نامعتبر"); return; }
  state.profile = { age, height, weight };
  state.plan = buildPlan(age, height, weight);
  save();
  const a = analyze(age, height, weight);
  document.getElementById("bmiInfo").innerHTML =
    `BMI: <b>${a.bmi.toFixed(1)}</b> (${a.bmiLabel}) · سطح: <b>${levelText(a.level)}</b><br>تعداد تمرین برنامه: <b>${state.plan.length}</b> — هر روز همان‌ها را تیک بزن.`;
  document.getElementById("levelHint").textContent = levelText(a.level);
  render();
  toast("برنامه ذخیره شد");
}

function isChecked(id, d){
  const k = key(d);
  return !!(state.checks[k] && state.checks[k][id]);
}
function toggle(id, d){
  const k = key(d);
  if (!state.checks[k]) state.checks[k] = {};
  state.checks[k][id] = !state.checks[k][id];
  if (!state.checks[k][id]) delete state.checks[k][id];
  save(); render();
}

function monthStats(){
  const y=view.getFullYear(), m=view.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const habits=state.plan||[];
  let done=0,total=habits.length*dim;
  for(let d=1;d<=dim;d++){
    const map=state.checks[key(new Date(y,m,d))]||{};
    habits.forEach(h=>{ if(map[h.id]) done++; });
  }
  return {done,total,pct: total?Math.round(done*100/total):0};
}
function todayStats(){
  const map=state.checks[key(new Date())]||{};
  const habits=state.plan||[];
  let done=0; habits.forEach(h=>{ if(map[h.id]) done++; });
  return {done,total:habits.length,pct:habits.length?Math.round(done*100/habits.length):0};
}

function render(){
  const days=[];
  const base=new Date(view.getFullYear(),view.getMonth(),Math.min(view.getDate(),28));
  const center=addDays(base,weekOffset*7);
  const start=startOfWeek(center);
  for(let i=0;i<7;i++) days.push(addDays(start,i));
  document.getElementById("weekLabel").textContent=days[0].getDate()+"–"+days[6].getDate();

  const ms=monthStats(), ts=todayStats();
  document.getElementById("monthPct").textContent=ms.pct+"%";
  document.getElementById("monthCount").textContent=ms.done+" / "+ms.total+" تیک";
  document.getElementById("todayRing").style.setProperty("--p", ts.pct);
  document.getElementById("todayPct").textContent=ts.pct+"%";

  const list=document.getElementById("list");
  list.innerHTML="";
  const habits=(state.plan||[]).filter(h=>filter==="all"||h.cat===filter);
  if(!habits.length){
    list.innerHTML=`<div style="color:var(--muted);text-align:center;padding:24px">ابتدا سن، قد و وزن را بده و «ساخت برنامه» را بزن.</div>`;
    return;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  habits.forEach(h=>{
    const el=document.createElement("div");
    el.className="habit";
    const daysHtml=days.map(d=>{
      const done=isChecked(h.id,d);
      const future=d>today;
      const isToday=d.getTime()===today.getTime();
      return `<div class="day ${done?"done":""} ${future?"future":""} ${isToday?"today":""}" data-id="${h.id}" data-k="${key(d)}">${done?"✓":d.getDate()}</div>`;
    }).join("");
    el.innerHTML=`
      <div class="top">
        <div>
          <div class="name">${h.name}</div>
          <div class="meta">${h.dose}${h.note?" · "+h.note:""}</div>
        </div>
        <span class="tag">${CAT_NAME[h.cat]}</span>
      </div>
      <button type="button" class="detail-btn" data-detail="${h.id}">جزئیات حرکت</button>
      <div class="days">${daysHtml}</div>`;
    list.appendChild(el);
  });
  list.querySelectorAll(".day:not(.future)").forEach(d=>{
    d.onclick=()=>{
      const id=d.getAttribute("data-id");
      const [y,m,dd]=d.getAttribute("data-k").split("-").map(Number);
      toggle(id,new Date(y,m-1,dd));
    };
  });
  list.querySelectorAll("[data-detail]").forEach(b=>{
    b.onclick=()=>{
      const h=state.plan.find(x=>x.id===b.getAttribute("data-detail"));
      if(!h)return;
      document.getElementById("mTitle").textContent=h.name;
      document.getElementById("mBody").textContent=
        "دسته: "+CAT_NAME[h.cat]+"\nنسخه پیشنهادی: "+h.dose+"\n\nنحوه اجرا:\n"+h.how+"\n\nنکته:\n"+h.tip+(h.note?"\n\n"+h.note:"");
      document.getElementById("modal").classList.add("on");
    };
  });
}

document.getElementById("tabs").onclick=e=>{
  const b=e.target.closest("button[data-cat]"); if(!b)return;
  filter=b.dataset.cat;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render();
};
document.getElementById("btnPrev").onclick=()=>{weekOffset--;render()};
document.getElementById("btnNext").onclick=()=>{weekOffset++;render()};
document.getElementById("btnToday").onclick=()=>{view=new Date();weekOffset=0;render()};
document.getElementById("btnGen").onclick=gen;
document.getElementById("btnReset").onclick=()=>{
  if(!confirm("همه تیک‌های ذخیره‌شده پاک شود؟"))return;
  state.checks={}; save(); render(); toast("تیک‌ها پاک شد");
};
document.getElementById("mClose").onclick=()=>document.getElementById("modal").classList.remove("on");

// restore profile
if(state.profile && state.profile.age){
  document.getElementById("age").value=state.profile.age;
  document.getElementById("height").value=state.profile.height;
  document.getElementById("weight").value=state.profile.weight;
  if(state.plan && state.plan.length){
    const a=analyze(state.profile.age,state.profile.height,state.profile.weight);
    document.getElementById("bmiInfo").innerHTML=
      `BMI: <b>${a.bmi.toFixed(1)}</b> (${a.bmiLabel}) · <b>${levelText(a.level)}</b><br>تمرین‌ها از قبل ذخیره شده‌اند.`;
    document.getElementById("levelHint").textContent=levelText(a.level);
  }
}
render();
</script>
</body>
</html>
